name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # public/ is not covered by the root tsconfig — Vite builds it, so
      # without this step frontend type errors ship silently.
      - name: Type-check backend and frontend
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      # The only step that exercises the actual UI: Chromium drives the real
      # server through six flows, with a stub DM standing in for the LLM
      # (tests/e2e/stub-llm.mjs). Unit tests never catch a dead button.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npx playwright test

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
