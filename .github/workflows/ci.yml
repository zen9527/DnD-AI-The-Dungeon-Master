name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # public/ is not covered by the root tsconfig — Vite builds it, so
      # without this step frontend type errors ship silently.
      - name: Type-check backend and frontend
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
